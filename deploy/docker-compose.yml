
services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env to your Docker Hub image URI}
    # Apply pending migrations before boot. The image CMD deliberately does not
    # run them (see backend/Dockerfile), but a deploy must never leave a schema
    # change unapplied — this is the step the deployment was relying on people
    # to remember. `migrate deploy` is idempotent and additive-only: a boot
    # with no pending migration costs one round trip.
    command: ["npm", "run", "start:prod"]
    env_file:
      - .env
    expose:
      - "3000" # internal only — Caddy fronts all public traffic
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2
    ports:
      - "80:80" # ACME HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443" # HTTPS for go.linkshift.in
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
