<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/brand/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="LinkShift — precise link shortening, QR codes and analytics for people who care about every click."
    />
    <title>LinkShift — URL Shortener with QR Codes & Link Analytics</title>

    <meta property="og:title" content="LinkShift — URL Shortener with QR Codes & Link Analytics" />
    <meta
      property="og:description"
      content="Precise link shortening, QR codes and analytics for people who care about every click."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linkshift.in/" />
    <meta property="og:image" content="https://linkshift.in/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkShift — link shortening, QR codes and analytics" />
    <meta property="og:site_name" content="LinkShift" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkShift — URL Shortener with QR Codes & Link Analytics" />
    <meta
      name="twitter:description"
      content="Precise link shortening, QR codes and analytics for people who care about every click."
    />
    <meta name="twitter:image" content="https://linkshift.in/brand/og-image.png" />

    <link rel="canonical" href="https://linkshift.in/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Razorpay checkout SDK; the pricing page refuses to open checkout
         when this fails to load. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <script>
      try {
        if (localStorage.getItem("ls:access-token")) {
          document.documentElement.dataset.authed = "";
        }
      } catch {}
      try {
        var m = localStorage.getItem("ls:theme");
        var t =
          m === "light" || m === "dark"
            ? m
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
