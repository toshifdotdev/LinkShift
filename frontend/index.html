<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/linkshift-logo-64.png" />
    <link rel="apple-touch-icon" href="/brand/linkshift-logo-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" />
    <meta
      name="description"
      content="LinkShift — precise link shortening, QR codes and analytics for people who care about every click."
    />
    <title>LinkShift — Links that carry weight</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Razorpay checkout SDK; the pricing page refuses to open checkout
         when this fails to load. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <script>
      try {
        if (localStorage.getItem("ls:access-token")) {
          document.documentElement.dataset.authed = "";
        }
      } catch {}
      try {
        var m = localStorage.getItem("ls:theme");
        var t =
          m === "light" || m === "dark"
            ? m
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
